<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#17202B">
  <link rel="icon" href="/vendor/icono.svg" type="image/svg+xml">
  <link rel="manifest" href="/manifest.webmanifest">
  <title>Traffiqui</title>
  <link rel="stylesheet" href="/vendor/styles.css">
  <link rel="stylesheet" href="/static/cloud.css">
</head>
<body class="login-page">
  <main class="login">
    <div class="brand login-brand"><span>Traffiqui</span> <small>Sede principal</small></div>
    <form class="card" id="loginForm">
      <h2>Iniciar sesión</h2>
      <div class="field">
        <label for="email">Correo</label>
        <input type="email" id="email" autocomplete="username" required autofocus>
      </div>
      <div class="field">
        <label for="password">Contraseña</label>
        <input type="password" id="password" autocomplete="current-password" required>
      </div>
      <p class="login-error" id="loginError" role="alert" hidden></p>
      <button class="btn primary login-btn" type="submit">Entrar</button>
    </form>
    <p class="note"><a href="/recuperar">¿Olvidaste tu contraseña?</a></p>
    <p class="note">Panel de la sede principal: todas las tiendas de tu empresa en un solo lugar.</p>
  </main>
  <script>
    document.getElementById('loginForm').addEventListener('submit', async ev => {
      ev.preventDefault();
      const err = document.getElementById('loginError');
      err.hidden = true;
      try {
        const r = await fetch('/api/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ email: document.getElementById('email').value, password: document.getElementById('password').value }) });
        const body = await r.json();
        if (!r.ok) throw new Error(body.detail || 'No se pudo iniciar sesión.');
        location.href = '/';
      } catch (e) { err.textContent = e.message; err.hidden = false; }
    });
  </script>
</body>
</html>
